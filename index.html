<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>For Kenta</title>
<meta name="description" content="A letter.">
<meta name="theme-color" content="#6C8F72">
<meta name="robots" content="noindex">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<meta property="og:title" content="For Kenta">
<meta property="og:description" content="A letter.">
<meta property="og:type" content="website">

<style>
:root{
  --ground:#6C8F72;
  --serif:"Times New Roman", Times, serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;background:var(--ground);
  font-family:var(--serif);color:#F0EEE8;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

/* a little depth in the room */
.vig{
  position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(120% 90% at 50% 44%, rgba(255,255,255,.03), rgba(0,0,0,.24) 84%);
}

/* if WebGL will not run, the letter still has to arrive */
.plain{
  position:fixed;inset:0;z-index:4;display:none;overflow:auto;
  background:var(--ground);padding:9vh 22px;
}
body.plain-on .plain{display:block}
.sheet{
  max-width:430px;margin:0 auto;background:#FAF9F5;color:#222;
  padding:46px 38px 42px;box-shadow:0 18px 40px rgba(0,0,0,.28);
}
.sheet h1{margin:0 0 26px;font-size:30px;font-weight:400;letter-spacing:-0.01em}
.sheet img{display:block;width:100%;height:auto;margin:0 0 26px}
.sheet p{margin:0;font-size:16px;line-height:1.45}
.sheet .sign{margin-top:26px;font-style:italic;color:#6E6E68}
</style>
</head>

<body>

<div class="vig"></div>

<div class="plain">
  <div class="sheet">
    <h1>Happy birthday</h1>
    <img src="call.webp" alt="">
    <p>we&rsquo;ve been given the gift of changing the world, not everyone is
    able to realise it, we can be so great, so let&rsquo;s be so great</p>
    <p class="sign">love you, K</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
"use strict";
/* ==========================================================================
   For Kenta.
   An envelope sits tilted on a grey field. Click it: it straightens, turns
   over, the flap lifts, and a letter folded in thirds slides out and opens
   along its creases. It leans toward whoever is looking.
   ========================================================================== */

const PAPER  = "#FAF9F5";
const GREY   = "#747370";          /* the envelope stock */
const GROUND = 0x6C8F72;

/* envelope, and the letter folded into three bands */
const EW = 2.00, EH = 1.22, ED = .10;
const LW = 1.88, LH = 2.52, BAND = LH / 3;

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---- the shirt: a tartan sett drawn warp over weft, softened ------------------ */
function tartanTex(){
  const S = 1024, c = document.createElement("canvas");
  c.width = c.height = S;
  const x = c.getContext("2d");
  const G = "#52A86A", g = "#78BE84", B = "#5F8FE4", b = "#94B2EC",
        W = "#F4EFE3", P = "#FF5C84", D = "#2F7350";
  /* one half of the sett; it mirrors to tile */
  const half = [[G,34],[W,5],[G,9],[g,6],[B,22],[P,3.5],[B,22],[g,6],[G,9],[W,5],[G,34],
                [D,14],[B,16],[b,6],[W,4],[b,6],[B,16],[D,14]];
  const sett = half.concat(half.slice().reverse());
  const total = sett.reduce((a, s) => a + s[1], 0), u = S / total;

  const stripes = (vertical) => {
    let at = 0;
    for (const [col, w] of sett){
      x.fillStyle = col;
      if (vertical) x.fillRect(at * u, 0, w * u + .6, S);
      else          x.fillRect(0, at * u, S, w * u + .6);
      at += w;
    }
  };
  stripes(true);
  x.globalAlpha = .52; stripes(false); x.globalAlpha = 1;

  /* the twill: faint diagonals so it reads as cloth, not print */
  x.strokeStyle = "rgba(255,255,255,.075)"; x.lineWidth = 1.2;
  x.beginPath();
  for (let d = -S; d < S * 2; d += 4){ x.moveTo(d, 0); x.lineTo(d - S, S); }
  x.stroke();
  x.strokeStyle = "rgba(0,0,0,.05)";
  x.beginPath();
  for (let d = -S + 2; d < S * 2; d += 4){ x.moveTo(d, 0); x.lineTo(d - S, S); }
  x.stroke();

  /* softened, so the letter stays the loudest thing on it */
  x.fillStyle = "rgba(118,150,128,.09)"; x.fillRect(0, 0, S, S);

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}

/* ---- the two faces of the envelope, drawn once ----------------------------- */
function envCanvas(draw){
  const c = document.createElement("canvas");
  c.width = 1536; c.height = Math.round(1536 * EH / EW);
  const x = c.getContext("2d");
  x.fillStyle = GREY; x.fillRect(0, 0, c.width, c.height);
  draw(x, c.width, c.height);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function frontTex(){
  return envCanvas((x, w, h) => {
    x.fillStyle = "#F3F1EC";
    x.font = "84px 'Times New Roman', Times, serif";
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText("For Kenta", w / 2, h / 2 + 4);
  });
}
/* the back carries the seams of the side and bottom folds */
function backTex(){
  return envCanvas((x, w, h) => {
    const ax = w / 2, ay = h * .60;
    x.lineWidth = 2.5; x.strokeStyle = "rgba(0,0,0,.17)";
    x.beginPath();
    x.moveTo(0, 0); x.lineTo(ax, ay); x.moveTo(w, 0); x.lineTo(ax, ay);
    x.moveTo(0, h); x.lineTo(ax, ay); x.moveTo(w, h); x.lineTo(ax, ay);
    x.stroke();
    x.lineWidth = 1.5; x.strokeStyle = "rgba(255,255,255,.11)";
    x.beginPath();
    x.moveTo(0, 3); x.lineTo(ax, ay + 3); x.moveTo(w, 3); x.lineTo(ax, ay + 3);
    x.stroke();
  });
}

/* ---- the letter itself ------------------------------------------------------ */
function wrap(x, text, left, top, maxW, lh){
  const words = text.split(" ");
  let line = "", y = top;
  for (const word of words){
    const test = line ? line + " " + word : word;
    if (x.measureText(test).width > maxW && line){
      x.fillText(line, left, y); line = word; y += lh;
    } else line = test;
  }
  if (line) x.fillText(line, left, y);
  return y;
}

function letterTex(photo){
  const c = document.createElement("canvas");
  c.width = 1400; c.height = Math.round(1400 * LH / LW);
  const x = c.getContext("2d"), W = c.width, H = c.height;
  x.scale(1400 / 1100, 1400 / 1100);          /* lay out at the old size, draw sharper */
  const W0 = 1100, H0 = Math.round(1100 * LH / LW);
  x.fillStyle = PAPER; x.fillRect(0, 0, W0, H0);
  const g = x.createLinearGradient(0, 0, W0 * .4, H0);
  g.addColorStop(0, "rgba(255,255,255,.55)");
  g.addColorStop(1, "rgba(206,202,190,.30)");
  x.fillStyle = g; x.fillRect(0, 0, W0, H0);
  for (let i = 0; i < 2600; i++){
    x.fillStyle = "rgba(120,116,104," + (Math.random() * .045).toFixed(3) + ")";
    x.fillRect(Math.random() * W0, Math.random() * H0, 1.3, 1.3);
  }

  const M = 108, colW = W0 - M * 2;

  x.fillStyle = "#222222";
  x.textBaseline = "alphabetic";
  x.font = "84px 'Times New Roman', Times, serif";
  x.fillText("Happy birthday", M, 236);

  if (photo){
    const pw = colW, ph = pw * (photo.height / photo.width), py = 332;
    x.save();
    x.shadowColor = "rgba(0,0,0,.22)"; x.shadowBlur = 16; x.shadowOffsetY = 5;
    x.fillStyle = "#fff"; x.fillRect(M, py, pw, ph);
    x.restore();
    x.drawImage(photo, M, py, pw, ph);
    x.strokeStyle = "rgba(0,0,0,.10)"; x.lineWidth = 1;
    x.strokeRect(M + .5, py + .5, pw - 1, ph - 1);
  }

  x.fillStyle = "#222222";
  x.font = "40px 'Times New Roman', Times, serif";
  const end = wrap(x, "we’ve been given the gift of changing the world, not everyone is able to realise it, we can be so great, so let’s be so great", M, 1046, colW, 58);

  x.fillStyle = "#6E6E68";
  x.font = "italic 40px 'Times New Roman', Times, serif";
  x.fillText("love you, K", M, end + 98);

  /* the creases, where the thirds meet */
  for (const y of [H0 / 3, (H0 * 2) / 3]){
    const v = x.createLinearGradient(0, y - 9, 0, y + 9);
    v.addColorStop(0,   "rgba(255,255,255,0)");
    v.addColorStop(.42, "rgba(255,255,255,.58)");
    v.addColorStop(.52, "rgba(108,104,94,.20)");
    v.addColorStop(.62, "rgba(255,255,255,.34)");
    v.addColorStop(1,   "rgba(255,255,255,0)");
    x.fillStyle = v; x.fillRect(0, y - 9, W0, 18);
  }

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ---- scene ------------------------------------------------------------------ */
let renderer, scene, camera, env, flapPivot, letter, topPivot, botPivot, started = false;
let p = 0, dir = 0, last = 0;
const DUR = 6.0;

const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const seg  = (v, a, b) => ease(Math.min(1, Math.max(0, (v - a) / (b - a))));
const mix  = (a, b, t) => a + (b - a) * t;

/* it leans toward whoever is looking at it, and lifts a little under the hand */
const pt = { x:0, y:0, sx:0, sy:0, over:0, hover:0 };
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hitList = [];
addEventListener("pointermove", ev => {
  pt.x = (ev.clientX / innerWidth)  * 2 - 1;
  pt.y = (ev.clientY / innerHeight) * 2 - 1;
}, { passive:true });

/* paper is never flat: give every panel a gentle undulation */
function paperGeo(w, h, shift){
  const g = new THREE.PlaneGeometry(w, h, 30, 16);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++){
    const X = pos.getX(i), Y = pos.getY(i);
    pos.setZ(i, Math.sin(X * 2.2 + 1.1) * .008 + Math.cos(Y * 3.1 + .4) * .005
                + Math.sin((X + Y) * 1.6) * .0035);
  }
  if (shift) g.translate(0, shift, 0);
  g.computeVertexNormals();
  return g;
}

function makePanel(tex, band, shift){
  const geo = paperGeo(LW, BAND, shift);
  const map = tex.clone();
  map.needsUpdate = true;
  map.repeat.set(1, 1 / 3);
  map.offset.set(0, band / 3);
  map.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const front = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map, roughness:.94, metalness:0 }));
  const back  = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:0xF0EFE9, roughness:.97, metalness:0, side:THREE.BackSide }));
  front.castShadow = back.castShadow = true;
  front.receiveShadow = back.receiveShadow = false;
  const grp = new THREE.Group();
  grp.add(front, back);
  return grp;
}

function build(photo){
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:"high-performance" });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.VSMShadowMap;
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(GROUND);

  camera = new THREE.PerspectiveCamera(32, 1, .1, 100);
  scene.add(camera);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x6f8a74, .82));
  const key = new THREE.DirectionalLight(0xfff6e9, 1.55);
  key.position.set(-2.2, 3.4, 7.0);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.radius = 7;
  key.shadow.blurSamples = 14;
  key.shadow.bias = -0.0006;
  const sc = key.shadow.camera;
  sc.left = -4; sc.right = 4; sc.top = 4; sc.bottom = -4; sc.near = .5; sc.far = 20;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xdfe4ee, .30);
  fill.position.set(3.6, -1.2, 2.4);
  scene.add(fill);

  /* the wall the shadow falls on */
  const cloth = tartanTex();
  cloth.repeat.set(40, 40);
  cloth.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const wall = new THREE.Mesh(
    new THREE.PlaneGeometry(70, 70),
    new THREE.MeshStandardMaterial({ map:cloth, roughness:1, metalness:0 })
  );
  wall.position.z = -.55;
  wall.receiveShadow = true;
  scene.add(wall);

  /* -- envelope: a thin box, open along the top -- */
  env = new THREE.Group();
  scene.add(env);

  const stock = { color:0xffffff, roughness:.93, metalness:0 };
  const side  = new THREE.MeshStandardMaterial({ color:0x6D6C68, roughness:.93, side:THREE.DoubleSide });
  const none  = new THREE.MeshStandardMaterial({ visible:false });
  const body = new THREE.Mesh(new THREE.BoxGeometry(EW, EH, ED), [
    side, side, none, side,
    new THREE.MeshStandardMaterial(Object.assign({ map: frontTex() }, stock)),
    new THREE.MeshStandardMaterial(Object.assign({ map: backTex()  }, stock))
  ]);
  body.castShadow = true; body.receiveShadow = true;

  /* the flap, hinged along the top edge of the back */
  const shape = new THREE.Shape();
  shape.moveTo(-EW / 2, 0); shape.lineTo(EW / 2, 0); shape.lineTo(0, -EH * .60);
  shape.closePath();
  const flap = new THREE.Mesh(new THREE.ShapeGeometry(shape),
    new THREE.MeshStandardMaterial({ color:0x6A6965, roughness:.93, side:THREE.DoubleSide }));
  flap.castShadow = true; flap.receiveShadow = true;
  flapPivot = new THREE.Group();
  flapPivot.position.set(0, EH / 2, -ED / 2 - .006);
  flapPivot.add(flap);

  env.add(body, flapPivot);
  hitList.push(body);

  /* -- letter: three bands on two creases -- */
  letter = new THREE.Group();
  scene.add(letter);

  const tex = letterTex(photo);
  const mid = makePanel(tex, 1, 0);
  topPivot = new THREE.Group();
  topPivot.position.set(0, BAND / 2, .018);
  topPivot.add(makePanel(tex, 2, BAND / 2));
  botPivot = new THREE.Group();
  botPivot.position.set(0, -BAND / 2, .009);
  botPivot.add(makePanel(tex, 0, -BAND / 2));
  letter.add(mid, topPivot, botPivot);
  hitList.push(letter);

  fit();
  addEventListener("resize", fit, { passive:true });
  renderer.setAnimationLoop(tick);
}

/* camera: back far enough for the envelope, then closes in on the letter */
let zEnv = 8, zLet = 6;
function fit(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const k = 2 * Math.tan((camera.fov * Math.PI / 180) / 2);
  zEnv = Math.max(EH * 3.9, (EW * 2.3) / camera.aspect) / k;
  zLet = Math.max(LH * 1.16, (LW * 1.16) / camera.aspect) / k + 1.15;
}

const qFlip = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
const qIn = new THREE.Quaternion(), qOut = new THREE.Quaternion();
const eOut = new THREE.Euler();
const vIn = new THREE.Vector3(), vOut = new THREE.Vector3();

function frame(){
  /* 1 straighten  2 turn over  3 flap  4 slide out  5 come forward  6,7 unfold */
  const straighten = seg(p, .00, .15);
  const flip       = seg(p, .10, .33);
  const flap       = seg(p, .31, .45);
  const rise       = seg(p, .43, .63);
  const travel     = seg(p, .60, .76);
  const openTop    = seg(p, .72, .88);
  const openBot    = seg(p, .84, 1.0);

  const idle = started ? 0 : 1;
  const t = performance.now() / 1000;
  const k = 1 - Math.pow(.935, dtFrames);           /* same feel at any frame rate */
  pt.sx += (pt.x - pt.sx) * k;
  pt.sy += (pt.y - pt.sy) * k;
  ndc.set(pt.x, -pt.y);
  ray.setFromCamera(ndc, camera);
  pt.over = ray.intersectObjects(hitList, true).length ? 1 : 0;
  pt.hover += (pt.over - pt.hover) * k;
  document.body.style.cursor = pt.over ? "pointer" : "";

  /* the envelope */
  const lean = 1 - flip;                               /* lets go once it turns */
  env.rotation.z = mix(-.075, 0, straighten) + idle * Math.sin(t * .7) * .012;
  env.rotation.y = flip * Math.PI + pt.sx * .20 * lean;
  env.rotation.x = mix(.06, 0, straighten) - pt.sy * .15 * lean;
  env.position.set(0, mix(0, -5.2, travel) + idle * Math.sin(t * .9) * .035,
                   mix(0, -.25, travel) + pt.hover * .09 * lean);
  flapPivot.rotation.x = -flap * 2.45;
  env.updateMatrixWorld();

  /* the letter rides inside the envelope, then comes forward on its own */
  vIn.set(0, mix(-.06, 1.46, rise), -.006).applyMatrix4(env.matrixWorld);
  qIn.copy(env.quaternion).multiply(qFlip);
  vOut.set(0, Math.sin(t * .8) * .012 * openBot, 1.15 + pt.hover * .04 * openBot);
  eOut.set(-pt.sy * .19, pt.sx * .26, pt.sx * .035);
  qOut.setFromEuler(eOut);
  letter.position.lerpVectors(vIn, vOut, travel);
  letter.quaternion.slerpQuaternions(qIn, qOut, travel);

  /* folded flat, then opening on the creases, keeping a little of the fold */
  topPivot.rotation.x = mix(-Math.PI * .995, -.055, openTop);
  botPivot.rotation.x = mix( Math.PI * .995,  .055, openBot);

  camera.position.set(0, 0, mix(zEnv, zLet, travel));
  camera.lookAt(0, 0, 0);
}

let dtFrames = 1;
function tick(now){
  const dt = last ? Math.min(.05, (now - last) / 1000) : 0;
  last = now;
  dtFrames = dt * 60;
  if (dir) p = Math.min(1, Math.max(0, p + dir * dt / DUR));
  frame();
  renderer.render(scene, camera);
}

/* ---- go --------------------------------------------------------------------- */
function open(){
  if (!started){ started = true; document.body.classList.add("went"); }
  dir = (dir === 1 || p === 1) ? -1 : 1;
  if (reduced){ p = dir === 1 ? 1 : 0; }
}
addEventListener("pointerdown", open);
addEventListener("keydown", ev => {
  if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); open(); }
});

/* ---- start: wait for the photo and the font, then build --------------------- */
function boot(){
  if (!window.THREE || !document.createElement("canvas").getContext("webgl")){
    document.body.classList.add("plain-on");
    return;
  }
  const img = new Image();
  img.onload  = () => build(img);
  img.onerror = () => build(null);
  img.src = "call.webp";
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot);
else addEventListener("load", boot);
</script>
</body>
</html>
